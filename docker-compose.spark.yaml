services:
  spark-master:
    image: apache/spark:3.5.7
    container_name: q4-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./data:/opt/spark/work-dir/data
    networks:
      - spark-network

  spark-worker:
    image: apache/spark:3.5.7
    container_name: q4-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on:
      - spark-master
    volumes:
      - ./jobs:/opt/spark/work-dir/jobs
      - ./data:/opt/spark/work-dir/data
    networks:
      - spark-network

networks:
  spark-network:
    name: q4-spark-network
